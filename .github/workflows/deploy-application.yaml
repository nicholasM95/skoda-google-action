name: Deploy application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Enter a value for image_tag'
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE: 'arn:aws:iam::896918338968:role/GitHubActionsSkodaGoogleActions'
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Import secret
        id: import-secret
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          role: github-actions-secret
          method: jwt
          path: github-actions-secret
          secrets: |
            github-actions-secret/data/secret K8S_CONFIG | K8S_CONFIG ;
            github-actions-secret/data/secret DOCKER_CONFIG | DOCKER_CONFIG ;
            github-actions-secret/data/secret VAULT_TOKEN | VAULT_TOKEN ;

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: eu-west-1

      - name: Configure K8S credentials
        run: |
          mkdir -p /home/runner/.kube
          echo $K8S_CONFIG | base64 -d > /home/runner/.kube/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infra/prod

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        working-directory: infra/prod

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: infra/prod

      - name: Terraform Plan
        id: plan
        run: terraform plan -var image_tag=${{ github.event.inputs.image_tag }} -var docker_config=$DOCKER_CONFIG
        working-directory: infra/prod

      - name: Terraform Apply
        id: apply
        run: terraform apply -var image_tag=${{ github.event.inputs.image_tag }} -var docker_config=$DOCKER_CONFIG -auto-approve
        working-directory: infra/prod
